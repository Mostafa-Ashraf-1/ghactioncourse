on:
    workflow_dispatch:

jobs:
    hybrid_job:
        runs-on: ubuntu-latest
        steps:
        - name: Run command in ubuntu VM
          run: echo "This runs on ubuntu VM"

        - name: Run inside Alpine container
          uses: docker://alpine:3.14
          with:
            entrypoint: /bin/sh
            args: |
                -c "echo 'This step runs inside an Alpine container'"

        - name: Run another command on the Ubuntu VM
          run: echo "Back ti the VM"

    dockerized_job:
        runs-on: ubuntu-latest
        # container: node:20
        container:
            image: ghcr.io/my-org/my-private-image:latest
            credentials:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
        steps:
            - run: node --version
            - run: echo "This whole job runs inside a Node.js container"